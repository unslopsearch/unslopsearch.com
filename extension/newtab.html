<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab - Unslop Search</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      color: #fff;
      font-size: 3rem;
      font-weight: 300;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4em;
    }

    .strikethrough {
      text-decoration: line-through;
      color: #ff6b6b;
      opacity: 0.6;
    }

    .engine-selector {
      position: relative;
      display: inline-block;
    }

    .engine-current {
      background: none;
      border: none;
      color: #fff;
      font-size: inherit;
      font-weight: inherit;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 0.2em;
      border-bottom: 2px dashed rgba(255, 255, 255, 0.3);
      transition: border-color 0.2s;
    }

    .engine-current:hover {
      border-bottom-color: rgba(255, 255, 255, 0.6);
    }

    .engine-selector.open .engine-current {
      border-bottom-color: #4285f4;
    }

    .chevron {
      width: 0.6em;
      height: 0.6em;
      transition: transform 0.2s ease;
      opacity: 0.5;
    }

    .engine-selector.open .chevron {
      transform: rotate(180deg);
      opacity: 1;
    }

    .engine-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      background: #252542;
      border-radius: 12px;
      padding: 8px;
      min-width: 180px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
      z-index: 100;
    }

    .engine-selector.open .engine-dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }

    .engine-option {
      display: block;
      width: 100%;
      padding: 10px 16px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 1rem;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
    }

    .engine-option:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .engine-option.selected {
      color: #4285f4;
      background: rgba(66, 133, 244, 0.1);
    }

    .subtitle {
      color: #888;
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    .search-box {
      display: flex;
      background: #fff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    input[type="text"] {
      flex: 1;
      padding: 18px 28px;
      font-size: 1.2rem;
      border: none;
      outline: none;
      background: transparent;
    }

    button[type="submit"] {
      padding: 18px 32px;
      background: #4285f4;
      color: white;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    button[type="submit"]:hover {
      background: #3367d6;
    }

    .hint {
      margin-top: 1.5rem;
      color: #666;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
    }

    code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: #aaa;
    }

    .mode-toggle {
      background: none;
      border: none;
      color: #4285f4;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .mode-toggle:hover {
      opacity: 1;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <div class="engine-selector" id="engine-selector">
        <button class="engine-current" id="engine-current" type="button">
          <span id="engine-name">Google</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="engine-dropdown" id="engine-dropdown">
          <button class="engine-option selected" data-engine="google">Google</button>
          <button class="engine-option" data-engine="duckduckgo">DuckDuckGo</button>
          <button class="engine-option" data-engine="brave">Brave</button>
          <button class="engine-option" data-engine="startpage">Startpage</button>
          <button class="engine-option" data-engine="qwant">Qwant</button>
          <button class="engine-option" data-engine="mojeek">Mojeek</button>
        </div>
      </div>
      <span class="strikethrough">AI</span>
    </h1>
    <p class="subtitle">Search without the AI Overview</p>

    <form class="search-box" id="search-form">
      <input type="text" id="query" placeholder="Search Google..." autofocus>
      <button type="submit">Search</button>
    </form>

    <p class="hint">
      Appends <code id="hint-method">-ai</code> to your search
      <button class="mode-toggle" id="mode-toggle" type="button"></button>
    </p>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
