<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3367d6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="200" fill="#4285f4" opacity="0.05"/>
  <circle cx="1100" cy="530" r="250" fill="#1a1a2e" opacity="0.1"/>

  <!-- Icon -->
  <g transform="translate(520, 100)">
    <circle cx="80" cy="80" r="70" fill="url(#accentGrad)"/>
    <circle cx="65" cy="65" r="35" fill="none" stroke="white" stroke-width="10"/>
    <line x1="90" y1="90" x2="120" y2="120" stroke="white" stroke-width="12" stroke-linecap="round"/>
    <text x="65" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="white">AI</text>
    <line x1="40" y1="65" x2="90" y2="65" stroke="#ff6b6b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="300" fill="white">
    <tspan>Google</tspan>
    <tspan fill="#ff6b6b" opacity="0.6" text-decoration="line-through">AI</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#888888">
    Search without the AI Overview
  </text>

  <!-- Features -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#4285f4">
    <text x="240" y="520" text-anchor="middle">Google</text>
    <text x="420" y="520" text-anchor="middle">DuckDuckGo</text>
    <text x="600" y="520" text-anchor="middle">Brave</text>
    <text x="780" y="520" text-anchor="middle">Startpage</text>
    <text x="960" y="520" text-anchor="middle">+ More</text>
  </g>

  <!-- Dots between features -->
  <g fill="#4b5563">
    <circle cx="330" cy="514" r="4"/>
    <circle cx="510" cy="514" r="4"/>
    <circle cx="690" cy="514" r="4"/>
    <circle cx="870" cy="514" r="4"/>
  </g>

  <!-- URL -->
  <text x="600" y="590" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#666666">
    unslopsearch.com
  </text>
</svg>
